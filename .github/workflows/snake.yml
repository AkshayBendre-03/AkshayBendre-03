name: Generate Contribution Snake

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AkshayBendre-03
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#0891b2&color_dots=#f1f5f9,#bae6fd,#38bdf8,#059669,#7c3aed
            dist/github-contribution-grid-snake-dark.svg?color_snake=#22d3ee&color_dots=#2d3343,#0891b2,#22d3ee,#10b981,#a78bfa

      - name: Push Snake SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

